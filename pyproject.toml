[project]
name = "dashboard-efek-mutasi"
version = "0.1.0"
description = "Dashboard efek mutasi tunggal: hasil penelitian Malinois pada Siraj SatMut dan prediksi model acuan"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "numpy>=2.0",
    "pandas>=2.2",
    "torch>=2.5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
